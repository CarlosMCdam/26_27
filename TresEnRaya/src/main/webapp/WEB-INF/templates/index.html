<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tres en Raya - Configuración</title>
    <style>
        html {
            background: #242222;
        }

        body {
            color: #dadada;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        .form-container {
            display: inline-flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
            background: #1c1a1a;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #000;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.95rem;
            font-weight: bold;
            color: #e3e3e3;
        }

        .input-group input {
            padding: 10px;
            font-size: 1rem;
            background-color: #242222;
            border: 1px solid #444;
            color: #dadada;
            border-radius: 4px;
            width: 250px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #656565;
        }

        .btn-submit {
            margin-top: 10px;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            background-color: #333;
            color: #e3e3e3;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

<h1>Tres en raya</h1>

<form action="/game" method="GET" class="form-container">
    <div class="input-group">
        <label for="firstPlayerName">Jugador X (Primer Turno):</label>
        <input type="text" id="firstPlayerName" name="firstPlayerName" required placeholder="Nombre del jugador X">
    </div>

    <div class="input-group">
        <label for="secondPlayerName">Jugador O (Segundo Turno):</label>
        <input type="text" id="secondPlayerName" name="secondPlayerName" required placeholder="Nombre del jugador O">
    </div>

    <button type="submit" class="btn-submit">Empezar Partida</button>
</form>

</body>
</html>
